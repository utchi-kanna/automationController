<!DOCTYPE html>
<html lang="en">
  <head>
    <title>A Template App</title>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Freshworks Crayons (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.js"></script>

    <!-- Local Styles -->
    <link rel="stylesheet" type="text/css" href="styles/style.css" />

    <!-- Freshworks App SDK -->
    <script async src="https://cdn.freshdev.io/assets/app-client@2.js"></script>
  </head>

  <body>

    <br>

    <!-- Buttons -->
    <fw-button color="primary" onclick="fetchAutomationsWithErrorHandling()">Fetch Automations</fw-button>
    <br><br>


    <!-- Selection Controls -->
    <div id="selection-controls" class="disabled-state">
      <fw-text class="section-title">Selective Automation Management</fw-text>
      <br>
      
      <!-- Filter by Type -->
      <div class="filter-section">
        <fw-text class="filter-label">Filter by Type:</fw-text>
        <fw-checkbox id="filterTicketCreation" checked disabled>Ticket Creation Rules</fw-checkbox>
        <fw-checkbox id="filterTicketUpdate" checked disabled>Ticket Update Rules</fw-checkbox>
        <fw-checkbox id="filterHourly" checked disabled>Hourly Rules</fw-checkbox>
      </div>
      
      <!-- Selection Actions -->
      <div class="selection-actions">
        <fw-button id="disableSelectedBtn" color="danger" size="medium" onclick="disableSelectedWithErrorHandling()" disabled class="action-button">Disable Selected</fw-button>
        <fw-button id="enableSelectedBtn" color="success" size="medium" onclick="enableSelectedWithErrorHandling()" disabled class="action-button enable-btn">Enable Selected</fw-button>
      </div>
      
      <br>
      <fw-text class="selection-info" id="selectionInfo">Selected: 0 of 0</fw-text>
      <br>
    </div>

    <!-- Titles -->
    <fw-text id="titleActiveOff" style="display: none;">Active Automation Rules</fw-text>
    <fw-text id="titleActiveOn" style="display: none;">This account already has automations disabled. Please find the list below and enable them.</fw-text>

    <br>

    <!-- Automation List -->
    <div id="automation-list"></div>
  </body>

  <!-- Local Scripts -->
  <script defer src="scripts/app.js"></script>
</html>
