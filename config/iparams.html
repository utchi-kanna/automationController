<html>
<head>
  <title>install_page</title>
  <link rel='stylesheet' type='text/css' href='https://static.freshdev.io/fdk/2.0/assets/freshworks.css'>
  <link rel="stylesheet" type="text/css" href="./assets/iparams.css">
  <style>
    body {
      font-family: "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: #f4f6f9;
      padding: 32px;
    }
  
    .form {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border: 1px solid #e4e7eb;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }
  
    #verifyForm {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
  
    input[type='text'] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d0d4d9;
      border-radius: 4px;
      font-size: 14px;
      color: #1f2933;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
  
    input[type='text']::placeholder {
      color: #9aa5b1;
    }
  
    input[type='text']:focus {
      outline: none;
      border-color: #2c8ef4;
      box-shadow: 0 0 0 2px rgba(44, 142, 244, 0.2);
    }
  
    button#verifyBtn {
      background-color: #2c8ef4;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
  
    button#verifyBtn:hover {
      background-color: #001b37;
    }
  
    .error {
      color: #d93025;
      font-size: 12px;
      margin-top: 4px;
    }
  
    .status {
      font-size: 14px;
      margin-top: 8px;
      font-weight: 500;
      color: #333;
    }
  </style>
  
</head>
<body>
  <div class='form'>
    <form id="verifyForm">
      <input type='text' name='domain' id='domain' placeholder='Domain Name (e.g. yourcompany.freshdesk.com)' />
      <div id="domain_error" class="error"></div>

      <input type='password' name='api_key' id='api_key' placeholder='API Key' />
      <div id="api_key_error" class="error"></div>

      <button type="button" id="verifyBtn">Verify</button>
      <div id="verifyStatus" class="status"></div>
    </form>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.0/jquery.min.js"></script>
  <script src="https://cdn.freshdev.io/assets/app-client@2.js"></script>
  <script src="./assets/iparams.js"></script>
</body>
</html>
